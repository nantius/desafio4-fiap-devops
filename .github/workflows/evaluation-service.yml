name: evaluation-service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/reusable-go.yml"
  pull_request:
    branches: [master]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/reusable-go.yml"

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-go.yml
    permissions:
      contents: write   # update-gitops job commits the new image tag
    with:
      service: evaluation-service
      ecr_repository: evaluation-service
      binary_name: evaluation-service
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
