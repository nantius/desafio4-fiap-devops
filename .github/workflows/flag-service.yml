name: flag-service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/reusable-python.yml"
  pull_request:
    branches: [master]
    paths:
      - "flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/reusable-python.yml"

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-python.yml
    permissions:
      contents: write   # update-gitops job commits the new image tag
    with:
      service: flag-service
      ecr_repository: flag-service
      port: "8002"
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
