apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD uses this file to discover and order resources in this folder.
# The deployment.yaml image tag is updated by the CI update-gitops job
# after each successful ECR push.
#
# AWS Academy: KEDA (triggerAuthentication.yaml + scaledobject.yaml) was
# replaced by a CPU-based HorizontalPodAutoscaler (hpa.yaml), since the KEDA
# SQS scaler requires IRSA which is unavailable on the lab account.

resources:
  - namespace.yaml
  - service-account.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
