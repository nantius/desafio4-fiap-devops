apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-auth
  namespace: analytics-service
spec:
  # Use the KEDA operator's own IRSA identity (the keda-operator service
  # account is annotated with an IAM role that has sqs:GetQueueAttributes).
  podIdentity:
    provider: aws
    identityOwner: keda
