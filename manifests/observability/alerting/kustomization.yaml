apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

# Alerting + self-healing resources (Fase 4 req. 4):
#   - prometheus-rules.yaml      : the auth 5xx > 5% alert
#   - alertmanager-config.yaml   : routes to PagerDuty + Discord + self-heal adapter
#   - ../self-healing/*          : the webhook-adapter deployment + service
resources:
  - prometheus-rules.yaml
  - alertmanager-config.yaml
  # Reference the sibling directory as a kustomize base (allowed), rather than
  # individual files outside this dir (which kustomize forbids for security).
  - ../self-healing
