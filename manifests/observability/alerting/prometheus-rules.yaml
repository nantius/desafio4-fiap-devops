# PrometheusRule — the "smart alert" for Fase 4 req. 4.
#
# Fires when the auth-service HTTP 5xx error rate exceeds 5% of its traffic
# over a 5-minute window. auth-service is Go (otelhttp), so its request count
# is the http_server_request_duration_seconds_count histogram counter, with the
# status in http_response_status_code. It comes from the OpenTelemetry
# instrumentation, routed into Prometheus by the OTel Collector's
# prometheusremotewrite exporter.
#
# kube-prometheus-stack's Prometheus is configured with
# ruleSelectorNilUsesHelmValues=false, so it discovers this rule across
# namespaces by its release label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-service-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack   # matched by the Prometheus ruleSelector
    app.kubernetes.io/part-of: toggle-master
spec:
  groups:
    - name: auth-service.rules
      rules:
        - alert: AuthServiceHigh5xxRate
          # 5xx rate as a percentage of all auth-service requests.
          # "> 0" on the denominator avoids divide-by-zero with no traffic
          # without distorting the ratio (traffic here is < 1 req/s, so the
          # old clamp_min(..., 1) would have under-reported the percentage).
          expr: >
            100 * sum(rate(http_server_request_duration_seconds_count{service_name="auth-service", http_response_status_code=~"5.."}[5m]))
            / (sum(rate(http_server_request_duration_seconds_count{service_name="auth-service"}[5m])) > 0)
            > 5
          for: 1m
          labels:
            severity: critical
            service: auth-service
          annotations:
            summary: "auth-service 5xx error rate above 5%"
            description: >
              auth-service has returned HTTP 5xx responses for more than 5% of
              requests over the last 5 minutes. Triggering self-healing
              (rollout restart) and paging on-call.
            runbook_url: "https://github.com/nantius/desafio4-fiap-devops/blob/main/docs/runbooks/auth-5xx.md"
