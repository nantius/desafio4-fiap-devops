apiVersion: batch/v1
kind: Job
metadata:
  name: init-targeting-db
  namespace: targeting-service
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: init-db
          image: postgres:15
          command: ["psql"]
          args:
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-f"
            - "/init/init.sql"
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: DB_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: DB_PORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: targeting-service-config
                  key: DB_NAME
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DB_PASS
            - name: PGSSLMODE
              value: "require"
          volumeMounts:
            - name: init-sql
              mountPath: /init
      restartPolicy: Never
      volumes:
        - name: init-sql
          configMap:
            name: targeting-db-init-sql
