apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD uses this file to discover and order resources in this folder.
# The deployment.yaml image tag is updated by the CI update-gitops job
# after each successful ECR push.
# db-job.yaml runs a one-time DB migration Job on first deploy.

resources:
  - namespace.yaml
  - service-account.yaml
  - configmap.yaml
  - db-init-configmap.yaml
  - secret.yaml
  - db-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
